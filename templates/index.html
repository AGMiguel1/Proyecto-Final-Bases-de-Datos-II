<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    <div class="container">
        <h2 class="text-center mt-5 mb-5">
            APP API-REST PYTHON - FLASK - MONGODB
        </h2>

        <div class="row">
            <!-- Alta producto -->
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-header">
                        <h6 class="text-center mb-0">
                            Alta producto
                        </h6>
                    </div>

                    <div class="card-body">
                        <form
                            action="{{ url_for('addProduct') }}"
                            method="POST"
                        >
                            <div class="mb-3">
                                <label for="name">Nombre</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="price">Precio</label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="price"
                                    name="price"
                                    min="0"
                                    step="0.01"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="quantity">Cantidad</label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="quantity"
                                    name="quantity"
                                    min="0"
                                    step="1"
                                    required
                                >
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Guardar
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Productos -->
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-header">
                        <h6 class="text-center mb-0">
                            Productos
                        </h6>
                    </div>

                    <div class="card-body">
                        <ul class="list-group">
                            {% for product in products %}
                                <li class="list-group-item mb-3">
                                    <form
                                        action="{{ url_for('edit', product_name=product.name) }}"
                                        method="POST"
                                    >
                                        <small>NOMBRE</small>
                                        <input
                                            type="text"
                                            class="form-control mb-2"
                                            value="{{ product.name }}"
                                            name="name"
                                            required
                                        >

                                        <small>PRECIO</small>
                                        <input
                                            type="number"
                                            class="form-control mb-2"
                                            value="{{ product.price }}"
                                            name="price"
                                            min="0"
                                            step="0.01"
                                            required
                                        >

                                        <small>CANTIDAD</small>
                                        <input
                                            type="number"
                                            class="form-control mb-3"
                                            value="{{ product.quantity }}"
                                            name="quantity"
                                            min="0"
                                            step="1"
                                            required
                                        >

                                        <button
                                            type="submit"
                                            class="btn btn-primary btn-sm"
                                        >
                                            Editar
                                        </button>

                                        <a
                                            href="{{ url_for('delete', product_name=product.name) }}"
                                            class="btn btn-danger btn-sm"
                                        >
                                            Eliminar
                                        </a>
                                    </form>
                                </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
